<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 200px;
      padding: 10px;
    }
    .speed-options {
      display: flex;
      gap: 6px;
    }
    .speed-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 14px;
      border: 1px solid #ccc;
      background-color: #f5f5f5;
      color: #333;
      cursor: pointer;
      border-radius: 4px;
    }
    .speed-btn.selected {
      background-color: #ff0000;
      color: white;
      border-color: #ff0000;
    }
    #saveButton {
      width: 100%;
      padding: 5px;
      background-color: #ff0000;
      color: white;
      font-size: 14px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>Select Default Speed</h3>
  <div class="speed-options" id="speedOptions">
    <button class="speed-btn" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="1.5">1.5x</button>
    <button class="speed-btn" data-speed="2">2x</button>
  </div>
  <button id="saveButton">Save</button>
  <p id="statusMessage"></p>

  <script src="popup.js"></script>
</body>
</html>
